<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Noway.net – Client Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5efe3; color: #2c2418; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
        .retro-stripe { background: linear-gradient(90deg, #5e9b3a 0%, #f4b400 20%, #e65c1e 40%, #c13b1b 60%, #6a3e9b 80%, #3c6eb4 100%); height: 4px; width: 100%; }
        .apple-button { background: #2c6e9e; color: white; font-weight: 600; padding: 10px 28px; border-radius: 40px; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
        .apple-button:hover { background: #1e4a6e; transform: scale(1.02); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .nav-link { font-size: 14px; font-weight: 500; color: #4a3b2c; padding: 8px 16px; border-radius: 40px; transition: all 0.2s ease; }
        .nav-link:hover { background: rgba(193, 59, 27, 0.08); color: #c13b1b; }
        .form-input { width: 100%; padding: 12px 16px; border: 1px solid #e2dcd0; border-radius: 24px; background: white; transition: all 0.2s; }
        .form-input:focus { outline: none; border-color: #c13b1b; box-shadow: 0 0 0 2px rgba(193,59,27,0.1); }
        .retro-card { background: #fffdf7; border: 1px solid #e2dcd0; border-radius: 32px; transition: all 0.2s; }
        .nav-container { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; }
        .nav-links-center { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.25rem; flex: 1; margin: 0 1rem; }
        .logo-img { height: 24px; width: auto; display: block; transition: transform 0.2s ease; }
        .group:hover .logo-img { transform: scale(1.05); }
        main { flex: 1; }
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; align-items: stretch; gap: 1rem; }
            .nav-links-center { order: 2; margin: 0; justify-content: center; gap: 0.5rem; }
            .logo-wrapper { order: 1; justify-content: center; }
            .apple-button { order: 3; align-self: center; }
            .logo-img { height: 20px; }
        }
    </style>
</head>
<body>
<div class="retro-stripe"></div>

<nav class="bg-white/90 backdrop-blur-md border-b border-[#e2dcd0] sticky top-0 z-50 shadow-sm">
    <div class="container mx-auto px-4 py-3">
        <div class="nav-container">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold tracking-tight group logo-wrapper shrink-0">
                <img src="C:\Users\seanm\OneDrive\Documents\usb drive\Noway Apperal\Version 2\NW Logo 3 Transp.png" alt="Noway.net Logo" class="logo-img">
                <span class="text-gray-800">Noway.net</span>
            </a>
            <div class="nav-links-center">
                <a href="booking.html" class="nav-link">Booking</a>
                <a href="hosting.html" class="nav-link">Hosting</a>
                <a href="maintenance.html" class="nav-link">Maintenance</a>
                <a href="priority.html" class="nav-link">Priority</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="client-progress.html" class="nav-link">My Projects</a>
            </div>
            <div class="shrink-0">
                <a id="authButton" href="register.html" class="apple-button text-sm py-1.5 px-5">Login / Sign up</a>
            </div>
        </div>
    </div>
</nav>

<main class="container mx-auto px-4 py-12 max-w-md">
    <div class="retro-card p-8 shadow-sm">
        <h2 class="text-2xl font-bold text-center mb-6">Client Access</h2>
        <div id="login-form">
            <div class="mb-4"><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="login-email" class="form-input" placeholder="you@example.com"></div>
            <div class="mb-6"><label class="block text-sm font-medium mb-1">Password</label><input type="password" id="login-password" class="form-input" placeholder="••••••••"></div>
            <button onclick="login()" class="apple-button w-full justify-center">Sign in</button>
            <p class="text-center text-sm text-[#5a4a34] mt-4">Don't have an account? <a href="#" onclick="showRegister()" class="text-[#c13b1b] underline">Create one</a></p>
        </div>
        <div id="register-form" style="display:none;">
            <div class="mb-4"><label class="block text-sm font-medium mb-1">Full name</label><input type="text" id="reg-name" class="form-input" placeholder="John Doe"></div>
            <div class="mb-4"><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="reg-email" class="form-input" placeholder="you@example.com"></div>
            <div class="mb-6"><label class="block text-sm font-medium mb-1">Password</label><input type="password" id="reg-password" class="form-input" placeholder="min. 6 characters"></div>
            <button onclick="register()" class="apple-button w-full justify-center">Create account</button>
            <p class="text-center text-sm text-[#5a4a34] mt-4">Already have an account? <a href="#" onclick="showLogin()" class="text-[#c13b1b] underline">Sign in</a></p>
        </div>
    </div>
</main>

<footer class="bg-white/80 border-t border-[#e2dcd0] py-8">
    <div class="container mx-auto px-4 text-center">
        <div class="retro-stripe w-28 mx-auto mb-5 rounded-full"></div>
        <p class="text-[#5a4a34] text-sm tracking-wide">© 2025 Noway.net — Retro Apple aesthetic. Precision crafted digital experiences.</p>
        <div class="flex justify-center gap-6 mt-4 text-xs text-[#7a6a54]">
            <a href="#" class="hover:text-[#c13b1b] transition">Privacy</a>
            <a href="#" class="hover:text-[#c13b1b] transition">Terms</a>
            <a href="contact.html" class="hover:text-[#c13b1b] transition">Support</a>
        </div>
    </div>
</footer>

<script>
    const USERS_KEY = 'noway_customers';
    function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
    function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
    function login() {
        const email = document.getElementById('login-email').value.trim();
        const pwd = document.getElementById('login-password').value;
        const users = getUsers();
        if (users[email] && users[email].password === pwd) {
            localStorage.setItem('noway_client_logged_in', JSON.stringify({ email, name: users[email].name }));
            window.location.href = 'booking.html';
        } else alert('Invalid email or password');
    }
    function register() {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const pwd = document.getElementById('reg-password').value;
        if (!name || !email || !pwd) return alert('Fill all fields');
        if (pwd.length < 6) return alert('Password must be at least 6 characters');
        const users = getUsers();
        if (users[email]) return alert('Email already registered');
        users[email] = { name, password: pwd, projects: [] };
        saveUsers(users);
        localStorage.setItem('noway_client_logged_in', JSON.stringify({ email, name }));
        window.location.href = 'booking.html';
    }
    function showRegister() { document.getElementById('login-form').style.display = 'none'; document.getElementById('register-form').style.display = 'block'; }
    function showLogin() { document.getElementById('login-form').style.display = 'block'; document.getElementById('register-form').style.display = 'none'; }
    if (localStorage.getItem('noway_client_logged_in')) window.location.href = 'booking.html';

    // Dynamic auth button (Login/Logout)
    const authButton = document.getElementById('authButton');
    const isLoggedIn = localStorage.getItem('noway_client_logged_in');
    function logout() {
        localStorage.removeItem('noway_client_logged_in');
        localStorage.removeItem('noway_cart');
        window.location.href = 'register.html';
    }
    if (isLoggedIn) {
        authButton.textContent = 'Logout';
        authButton.href = '#';
        authButton.onclick = function(e) { e.preventDefault(); logout(); };
    } else {
        authButton.textContent = 'Login / Sign up';
        authButton.href = 'register.html';
        authButton.onclick = null;
    }
</script>
</body>
</html>
